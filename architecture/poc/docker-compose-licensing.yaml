networks:
  licensing:

name: licensing-use-case
services:
  fl-orderer-1:
    container_name: fl-orderer-1
    environment:
      - FABRIC_LOGGING_SPEC=DEBUG
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
    image: hyperledger/fabric-orderer:3.1.1
    networks:
      - licensing
    ports:
      - "7350:7350"
      - "9443:9443"
    volumes:
      - ./state/hosts/fl-orderer-1/etc:/etc/hyperledger/fabric
      - ./state/hosts/fl-orderer-1/var:/var/hyperledger
      - ./state/cryptography/certs/ordererOrganizations/orderer.florida.gov/users/Admin@orderer.florida.gov/tls:/var/hyperledger/orderer/admin
      - ./state/cryptography/certs/ordererOrganizations/orderer.florida.gov/orderers/fl-orderer-1.orderer.florida.gov/msp:/var/hyperledger/orderer/msp
      - ./state/cryptography/certs/ordererOrganizations/orderer.florida.gov/orderers/fl-orderer-1.orderer.florida.gov/tls:/var/hyperledger/orderer/tls
      # ATTENTION! YOU MUST CHANGE THE BIN PATH TO EITHER THE X64 OR ARM DIRECTORY BASED ON YOUR COMPUTER'S ARCHITECTURE
      - ./bin/linux/X64/osnadmin:/usr/local/bin/osnadmin

  fl-dmv-peer0:
    build:
      context: .
      dockerfile: Peer_Dockerfile
    container_name: fl-dmv-peer0
    depends_on:
      - fl-orderer-1
    environment:
      - ADMIN_MSP=/etc/hyperledger/fabric/admin/msp
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/admin/msp
      - CORE_PEER_TLS_ENABLED=true
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=licensing-use-case_licensing
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - ORDERER_ADDRESS=fl-orderer-1
      - ORDERER_PORT=7350
      - PEER_MSP=/etc/hyperledger/fabric/msp
      - PEER_ADDRESS=fl-dmv-peer0
      - PEER_PORT=7351
      - PEER_MSP=FloridaDmvMSP
      - STATE_LICENSE_COLLECTION=Florida_LICENSE_COLLECTION
      - STATE_AGENCIES_MSP_IDS=FloridaMSP
      - STATE_DMV_MSP_ID=FloridaDmvMSP
      - STATE_DMV_LICENSEE_MSP_ID=FloridaDmvLicenseeMSP
      - THIRD_PARTY_MSP_IDS=InsurerCoMSP
      - INSURER_CO_PEER=insurer-co-fl-peer0
      - INSURER_CO_PEER_PORT=2351
    networks:
      - licensing
    ports:
      - "7351:7351"
      - "7352:7352"
    volumes:
      - ../code/licensing/Licensing/build/install:/chaincode/licensing
      - ../code/licensing/Licensing/florida_collections_config.json:/chaincode/licensing/config/collections_config.json
      - ./state/cryptography/certs/ordererOrganizations/orderer.florida.gov/orderers/fl-orderer-1.orderer.florida.gov/tls:/etc/hyperledger/fabric/orderer/tls
      - ./state/cryptography/certs/peerOrganizations/dmv.florida.gov/peers/peer0.dmv.florida.gov:/etc/hyperledger/fabric
      - ./state/cryptography/certs/peerOrganizations/dmv.florida.gov/users/Admin@dmv.florida.gov:/etc/hyperledger/fabric/admin
      - ./state/hosts/fl-dmv-peer0/etc/core.yaml:/etc/hyperledger/fabric/core.yaml
      - ./state/hosts/fl-dmv-peer0/hyperledger:/var/hyperledger/production
      - ./state/cryptography/certs/peerOrganizations/insurer-co.com/peers/peer0.insurer-co.com/tls/ca.crt:/etc/hyperledger/fabric/insurer-co/tls/ca.crt
      - ./scripts:/scripts
      # Docker socket -- on Mac you MUST enable the default builder
      - /var/run/docker.sock:/host/var/run/docker.sock
      # ATTENTION! YOU MUST CHANGE THE BIN PATH TO EITHER THE X64 OR ARM DIRECTORY BASED ON YOUR COMPUTER'S ARCHITECTURE
      - ./bin/linux/X64/configtxlator:/usr/local/bin/configtxlator
      - ./bin/linux/X64/discover:/usr/local/bin/discover

  sd-orderer-1:
    container_name: sd-orderer-1
    environment:
      - FABRIC_LOGGING_SPEC=DEBUG
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
    image: hyperledger/fabric-orderer:3.1.1
